[pacman-cache]
label = "Pacman package cache"
description = "paccache -r - keeps last 3 versions per package"
requires_elevation = true

[yay-cache]
label = "AUR build cache"
description = "removes ~/.cache/yay - build dirs and tarballs"

[orphans]
label = "Orphaned packages"
description = "review, then pacman -Rns - packages no longer required by any dep"
requires_elevation = true

[journal]
label = "Systemd journal"
description = "journalctl --vacuum-size=100M - keeps journal under 100 MiB"
requires_elevation = true

[npm-cache]
label = "npm cache"
description = "npm cache clean --force - npm _cacache"
requires_command = "npm"

[thumbnails]
label = "Thumbnail cache"
description = "rm -rf ~/.cache/thumbnails - safe, rebuilds on demand"
